# nginx — paste inside the server{} block for the site.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.redditstatic.com https://staging.dashboard.sgen.com; connect-src 'self' https:; frame-ancestors 'self'" always;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
# brotli_static on;   # if ngx_brotli is built in

location ~* \.(css|js|woff2|webp|png|jpg|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; }
location = /llms.txt      { default_type text/plain; }
location = /llms-full.txt { default_type text/plain; }
location = /ai.txt        { default_type text/plain; }
